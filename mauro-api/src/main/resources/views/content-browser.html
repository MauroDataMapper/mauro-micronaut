    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
    <style>
        @import url("https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,700,700i&display=swap");

        :root {
            --tblr-border-radius-scale: 2;
            /* font-size-adjust: 0.55; */
            --tblr-body-font-size: 16px;
            --tblr-font-sans-serif: Open Sans, system-ui, sans-serif;
            --tblr-body-color: var(--tblr-gray-800);
        }

        .card {
            --tblr-card-border-radius: 25px;
        }

        div.container-xl {
            max-width: 1500px;
        }

        nav div, nav a {
            width: fit-content;
        }

        nav, blockquote {
            --tblr-border-style: dotted;
            --tblr-border-width: 5px;
            border-left-width: 5px;
            --tblr-border-color: var(--tblr-blue-lt);
        }

        .nav {
            --tblr-nav-link-padding-x: 0.9rem;
            --tblr-nav-link-color: var(--tblr-gray-600);
        }

        .activetable {
            background-color: rgb(30, 160, 240) !important;
            color: var(--tblr-white) !important;
        }
