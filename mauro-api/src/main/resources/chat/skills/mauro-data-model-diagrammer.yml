routing:
  specificity: SPECIFIC
  useWhen:
    - users ask to explain or draw what a Mauro Data Model is
    - users ask how a Data Model relates to many data instances, records, forms, datasets, messages, or implementations
    - users ask for a conceptual text diagram of Data Models, Data Classes, Data Elements, Data Types, or Enumeration Values
    - users are confused about whether a Mauro Data Model is data itself, a schema, a template, or an instance
  avoidWhen:
    - users ask to search live catalogue content for Data Models or forms
    - users ask to inspect the actual children or structure of a specific Data Model in the catalogue
