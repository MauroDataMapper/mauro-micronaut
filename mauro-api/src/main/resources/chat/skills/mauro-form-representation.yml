instruction: |
  Use this skill to learn and apply Mauro's form-representation model prior to answering the user or choosing tool parameters.
  This guidance is primarily internal context for the assistant. Do not present it as "the Mauro Form Representation guide" or say "according to this skill" unless the user asks what guidance you used.
  Answer the user's actual question directly, using this mapping to avoid terminology mistakes.

  Identity rules:
  - A Data Element is not a Form.
  - A Data Element is a component within a form-like structure: it describes one field, question, or control.
  - A whole Form is usually represented as a Mauro Data Model in this Mauro context.
  - Therefore, if the user asks "Are DataElements forms?", answer "No. Data Elements are not forms; they usually represent fields or questions within a form. The whole form is usually represented as a Data Model."

  Search parameter decision rules:
  - If the user asks for "forms about X", "forms relating to X", "a form about X", or "form templates about X", search with domainTypes ["DataModel"].
  - If the user asks for "questions about X", "fields about X", or "controls about X", search with domainTypes ["DataElement"].
  - If the user asks for "sections about X" or "groups about X", search with domainTypes ["DataClass"].
  - If the user explicitly asks for both whole forms and fields/questions, search with domainTypes ["DataModel","DataElement"].
  - Never choose only ["DataElement"] for a request that asks for whole forms. Data Elements are components inside forms, not forms themselves.

  Core mapping:
  - A Form is usually represented as a Mauro Data Model when the whole form is being described as a reusable structure.
  - Form sections, pages, groups, or repeating groups are usually represented as Data Classes.
  - Form questions, fields, or controls are usually represented as Data Elements. This does not make a Data Element a Form; it makes it a field/question/control within the form structure.
  - The expected answer/value shape for a field is represented by a Data Type.
  - Pick lists, coded answers, and fixed choices are usually represented using Enumeration Types and Enumeration Values, or by links to Terminology/Code Set content when governed codes are needed.
  - A completed form submission is an instance of data that conforms to the Data Model. Mauro generally describes and governs the form metadata; it is not necessarily storing the completed submissions.
  - If the user asks for "forms related to X", they usually mean whole form definitions/templates. In Mauro terms, those are usually represented as Data Models. Use catalogue_search with domainTypes ["DataModel"] if the user wants actual catalogue items.
  - If the user asks for "questions related to X", they often mean form questions/fields about X. In Mauro terms, those are usually represented as Data Elements. Use catalogue_search with domainTypes ["DataElement"] if the user wants actual catalogue items.

  Optional explanation pattern:
  Use this kind of diagram only when the user asks for an explanation or when a short diagram would clarify the answer. Do not include it for simple yes/no terminology questions unless needed.

  ```text
  Form: Adult Diabetes Assessment
  = represented as a Mauro Data Model
  |
  +-- Section: Patient Details
  |   = Data Class
  |   |
  |   +-- Field: NHS Number
  |   |   = Data Element
  |   |   +-- Answer type: identifier/text pattern
  |   |       = Data Type
  |   |
  |   +-- Field: Date of Birth
  |       = Data Element
  |       +-- Answer type: date
  |           = Data Type
  |
  +-- Section: Clinical Measurements
      = Data Class
      |
      +-- Field: Weight
      |   = Data Element
      |   +-- Answer type: decimal, unit kg
      |       = Data Type
      |
      +-- Field: Smoking Status
          = Data Element
          +-- Answer type: choice list
              = Enumeration Type
              +-- Choices: Current | Former | Never | Unknown
                  = Enumeration Values

  Completed submission #1
      is data that conforms to the model
      Patient Details.NHS Number = ...
      Clinical Measurements.Weight = ...

  Completed submission #2
      is another data instance that conforms to the same model
  ```

  Explain common confusions:
  - The form definition/template is metadata and is modelled in Mauro.
  - A filled-in form is data, not the Data Model itself.
  - A form can be implemented in different systems while sharing the same Mauro metadata description.
  - A Data Class is not a Java/class programming construct; in Mauro it is a grouping or structure inside a Data Model.
  - A Data Element is not a form; it is a field/question/control within a form-like Data Model.
  - A Data Element describes a field/question; it is not the user-entered value for one submission.

  If the user asks for a broader diagram of Data Model structure, see also mauro-data-model-diagrammer.
  If the user needs definitions of individual Mauro terms, see also mauro-glossary.
  If the user wants the exact fields/sections for a specific catalogue form, use or suggest catalogue/model exploration tools rather than inventing structure.
