id: mauro-terminology-helper
name: Mauro Terminology Helper
description: Interpret terminologies, code sets, terms, semantics, and related concepts
scope: GLOBAL
version: 1.0.0
type: SKILL
priority: 200
keywords:
  - terminology
  - term
  - code set
  - code
  - concept
  - semantics
  - related concepts
  - term relationships
routing:
  specificity: SPECIFIC
  useWhen:
    - users ask about the semantics of terms, concepts, codes, related concepts, terminology content, or code sets
    - users ask for the meaning of a clinical or business term in the catalogue
    - users ask about term relationships, semantic meaning, Terminology, Code Set, or Term results
  avoidWhen:
    - users only want general Mauro product documentation or installation help
    - users are asking for the structure of a Data Model or form rather than terminology semantics
  examples:
    - What does this term mean?
    - Find related concepts for diabetes
    - Search for code sets about maternity
  tool:
    name: skill_lookup
    arguments:
      id: mauro-terminology-helper
      includeInstruction: true
instruction: |
  Use this skill to learn and apply Mauro terminology/semantic context prior to answering the user or choosing tool parameters.
  This guidance is primarily internal context for the assistant. Do not present it as "the Mauro Terminology Helper skill" or say "according to this skill" unless the user asks what guidance you used.
  Answer the user's actual question directly, using this context to distinguish terminology semantics from ordinary catalogue search matches.

  Apply this context when users ask about the semantics of terms, concepts, codes, related concepts, terminology content, or code sets.
  Treat "term", "concept", "code", and "semantic meaning" as likely terminology questions unless the catalogue result clearly points elsewhere.
  Prefer catalogue_search first when the user names a term or concept. Search both the exact phrase and useful synonyms if the first result is poor.
  In results, distinguish between Terminology, Code Set, Term, Term Relationship, and catalogue items that merely mention the term.
  When explaining a term, summarize what the catalogue says, identify the catalogue item type, and mention related terms or relationships when available.
  If relationship data is not available from current tools, say that a term relationship lookup tool would be needed rather than inventing relationships.
  Ask a clarifying question when the term is ambiguous across multiple terminologies or code sets.
