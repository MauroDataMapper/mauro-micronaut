micronaut:
  application:
    name: sandbox
    client:
      connect-timeout: 11s

  server:
    port: 8080
    max-request-size: 2gb
    multipart:
      max-file-size: 2gb
    cors:
      enabled: true
    host-resolution:
      protocol-header: X-Forwarded-Proto
      host-header: Host
      port-header: X-Forwarded-Port
  router:
    static-resources:
      default:
        paths: classpath:public
        mapping: /**
        enabled: true
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
  security:
    enabled: true
    authentication: session
    redirect:
      enabled: false
    endpoints:
      login:
        enabled: true
        path: '/api/authentication/login'
      logout:
        enabled: true
        path: '/api/authentication/logout'
        get-allowed: true
      oauth:
#        enabled: true
    reject-not-found: false
    authentication-provider-strategy: any
#    oauth2:
#      callback-uri: http://localhost:8080/oauth/callback{/provider}
#      clients:
#        keycloak:
#          client-id: mauro
#          client-secret: ZBXabk0H3TbnOlCvD4nrWzfSf32Ibgsx
#          openid:
#            issuer: http://localhost:9009/realms/mauro

  caches:
    items-cache:
      initial-capacity: 10000
      maximum-weight: 1_000_000_000
      expire-after-write: 1h
      record-stats: true
    security-cache:
      initial-capacity: 10000
      maximum-weight: 1_000_000_000
      expire-after-write: 1h
      record-stats: true
    api-property-cache:
      initial-capacity: 1000
      maximum-weight: 1_000_000_000
      expire-after-write: 1h
      record-stats: true

endpoints:
  routes:
    enabled: true
    sensitive: true
  beans:
    enabled: true
    sensitive: true
  flyway:
    enabled: true
    sensitive: true
  caches:
    enabled: true
    sensitive: true

jackson:
  serialization:
    writeDatesAsTimestamps: false

datasources:
  default:
    url: jdbc:postgresql://localhost:5432/sandbox?reWriteBatchedInserts=true
    username: sandbox
    password: sandbox
    dialect: POSTGRES
    db-type: postgres
    driver-class-name: org.postgresql.Driver


javamail:
  authentication:
    username: $$username$$ # Replace me!
    password: $$password$$ # Replace me!
  properties:
    mail:
      smtp:
        port: 587 # Replace me!
        auth: true
        starttls:
          enable: true
        host: $$host$$ # Replace me!

mauro:
