id: mauro-search-strategist
name: Mauro Search Strategist
description: Choosing effective Mauro catalogue searches and refining noisy result sets
scope: GLOBAL
version: 1.0.0
type: SKILL
priority: 220
keywords:
  - search
  - find
  - lookup
  - query
  - refine
  - websearch_to_tsquery
  - phrase search
  - quoted phrase
  - OR
  - exclude
  - synonyms
  - noisy results
  - no results
toolApplicability:
  - tool: mauro_search
    relationship: RECOMMENDED_CONTEXT
    useWhen:
      - refining broad, ambiguous, noisy, unsuccessful, or syntax-sensitive search requests
      - counting, filtering, narrowing, or asking how many of all previous search results match an extra condition
      - choosing quoted phrases, OR alternatives, exclusions, domainTypes, max, or offset
    avoidWhen:
      - answering Mauro installation, configuration, Docker, administration, or documentation questions
      - giving a direct glossary definition
    examples:
      - Out of all of those results, how many are about Education?
      - Search for maternity care but narrow it down
    instructions:
      - Use PostgreSQL websearch_to_tsquery syntax deliberately when formulating searchTerm.
      - For aggregate follow-ups over previous results, refine the search and answer from the returned count rather than counting the visible page.
routing:
  specificity: FALLBACK
  useWhen:
    - refining broad, ambiguous, noisy, or unsuccessful catalogue search requests
    - choosing how to refine a catalogue search or select better search terms
    - search results are poor, too broad, too sparse, or need synonyms, singular/plural variants, abbreviations, or related terms
    - counting, filtering, narrowing, or asking how many of all previous search results match an extra condition
  avoidWhen:
    - answering Mauro installation, configuration, Docker, administration, or documentation questions
    - giving a direct glossary definition handled by Mauro Glossary
  examples:
    - Find forms about diabetes
    - I cannot find the right item
    - Search for maternity care but narrow it down
    - Out of all of those results, how many are about education?
  tool:
    name: mauro_skill
    arguments:
      id: mauro-search-strategist
      includeInstruction: true
instruction: |
  Use this skill to learn and apply Mauro catalogue search strategy prior to choosing tool parameters.
  This guidance is internal operating context for the assistant. Do not present it as "the Mauro Search Strategist skill" or say "according to this skill" unless the user asks what guidance you used.
  Answer the user's actual question or perform the search; do not explain the search strategy unless it helps the user understand a changed or refined result set.

  Apply this context when a user's request is broad, ambiguous, or likely to need careful catalogue search.
  Treat polite wording such as "Would you find X by suggesting related terms and then searching?" as a request to perform that workflow: prepare/refine terms if useful, then search. Give a theoretical yes/no answer only when the user explicitly asks only about strategy.
  If related terms have been looked up for the current search task, use them in the subsequent mauro_search expression unless the user asks for narrowing or the related terms are clearly irrelevant.
  mauro_search is the default catalogue search and combines keyword search with semantic search when available. Preserve the user's supplied search text unless you are deliberately expanding it with related terms.
  The keyword leg of mauro_search uses PostgreSQL websearch_to_tsquery syntax for searchTerm:
  - The backend treats unquoted words as AND terms, so maternity care means maternity AND care.
  - Quoted phrases preserve word order, so "maternity care" searches for that phrase.
  - OR expresses keyword alternatives, so diabetes OR diabetic searches either term.
  - A leading dash excludes terms or quoted phrases, so diabetes -outpatients or diabetes -"outpatients clinic" removes noisy matches.
  Start with the user's exact phrase when it is specific. Quote multi-word labels or concepts when the user appears to want that exact phrase.
  If results are poor, try likely synonyms, singular/plural variants, abbreviations, or related clinical/business terms joined with OR. Preserve user-supplied alternative terms unless there is a clear reason to remove one.
  If results are noisy, keep the core term and exclude a repeated unwanted concept with -term or -"quoted phrase".
  If the user asks to count, filter, or narrow all results from a previous mauro_search, do not count only the visible page. Formulate a refined mauro_search by combining the previous searchTerm with the new condition and preserving the previous domainTypes where applicable. Use the returned total count as the answer.
  Example: if the previous search was searchTerm "age OR weight" with domainTypes ["DataElement"], and the user asks how many are about Education, call mauro_search with searchTerm "age education OR weight education", domainTypes ["DataElement"], max 5, offset 0, then answer from count.
  For broad searches, summarize the most relevant result clusters instead of listing everything.
  When results are noisy, ask a focused follow-up question such as whether the user wants forms, data elements, terms, models, or governance metadata.
  When no results are found, explain the search attempted and suggest alternative terms rather than giving a generic answer.
  When you deliberately use quoted phrases, OR, or exclusions, briefly mention the search expression used if it helps the user understand why the result set changed.
  Do not overuse tools when the prior tool result is already sufficient; summarize instead of running another search.
