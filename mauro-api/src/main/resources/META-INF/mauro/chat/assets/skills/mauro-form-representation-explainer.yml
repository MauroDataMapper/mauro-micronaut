routing:
  specificity: SPECIFIC
  useWhen:
    - explaining how forms are represented in Mauro
    - drawing or using a diagram/example showing Form, DataModel, DataClass, DataElement, DataType, and values
    - clarifying the difference between a form template and a completed form submission
  avoidWhen:
    - selecting internal search parameters only
