instruction: |
  Use this skill when answering the user with an explanation of form representation. Keep explanations short unless the user asks for detail.

  Basic explanation:
  - A form definition/template is metadata and is usually represented as a Mauro DataModel.
  - Sections, pages, groups, and repeating groups are usually DataClasses.
  - Fields, questions, and controls are usually DataElements.
  - The answer/value shape for a field is a DataType.
  - A completed submission is data that conforms to the model; it is not the DataModel itself.

  Optional text diagram:
  Use this kind of diagram only when the user asks for an explanation or when a short diagram would clarify the answer.

  ```text
  Form: Adult Diabetes Assessment
  = Mauro DataModel
  |
  +-- Section: Patient Details
  |   = DataClass
  |   |
  |   +-- Field: NHS Number
  |   |   = DataElement
  |   |   +-- Answer type: identifier/text pattern
  |   |       = DataType
  |   |
  |   +-- Field: Date of Birth
  |       = DataElement
  |       +-- Answer type: date
  |           = DataType
  |
  +-- Section: Clinical Measurements
      = DataClass
      |
      +-- Field: Weight
      |   = DataElement
      |   +-- Answer type: decimal, unit kg
      |       = DataType
      |
      +-- Field: Smoking Status
          = DataElement
          +-- Answer type: choice list
              = Enumeration Type
              +-- Choices: Current | Former | Never | Unknown
                  = Enumeration Values

  Completed submission #1
      is data that conforms to the model
      Patient Details.NHS Number = ...
      Clinical Measurements.Weight = ...
  ```

  Common confusions:
  - A DataElement is not a form; it is a field/question/control within a form-like DataModel.
  - A DataClass is not a Java/class programming construct; in Mauro it is a grouping or structure inside a DataModel.
  - A filled-in form is data, not the DataModel itself.
  - A form can be implemented in different systems while sharing the same Mauro metadata description.
