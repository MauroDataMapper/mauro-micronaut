id: mauro-form-representation-explainer
name: Mauro Form Representation Explainer
description: Explaining and diagramming how forms are represented in Mauro
scope: GLOBAL
version: 1.0.0
type: SKILL
priority: 207
keywords:
  - explain form representation
  - form diagram
  - form model diagram
  - how forms are represented
  - data model diagram
seeAlso:
