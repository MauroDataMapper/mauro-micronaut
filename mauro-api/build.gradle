buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.yaml:snakeyaml:2.1.3"
        classpath "org.apache.groovy:groovy-yaml:4.0.33"
    }
}
plugins {
    id("groovy")
    //id("com.gradleup.shadow") version "9.0.0"
    id("io.micronaut.application") version "4.6.2"
    id("io.micronaut.aot") version "4.6.2"
    id("org.openapi.generator") version "7.21.0"
    id("codenarc")
    id("java-test-fixtures")
    id "com.vanniktech.maven.publish" version "0.34.0"
}

repositories {
    mavenCentral()
}

ext.openApiEnabled = String.valueOf(findProperty('enableOpenApi') ?: 'false').equalsIgnoreCase('true')

if (!openApiEnabled) {
    configurations.configureEach {
        exclude group: 'io.micronaut.openapi', module: 'micronaut-openapi'
    }
}

dependencies {
    implementation project(':mauro-domain')
    implementation project(':mauro-client')
    implementation project(':mauro-persistence')

    testImplementation testFixtures(project(':mauro-client'))          // Pull in the filter that overwrites the port
    testImplementation testFixtures(project(':mauro-persistence'))     // Pull in the containerized testing definition

    //implementation "io.swagger.core.v3:swagger-annotations:2.2.8"
    if (openApiEnabled) {
        implementation("io.micronaut.openapi:micronaut-openapi")
    } else {
        compileOnly("io.micronaut.openapi:micronaut-openapi-annotations")
    }

    compileOnly("io.swagger.core.v3:swagger-annotations")
    compileOnly("io.micronaut.data:micronaut-data-processor")
    compileOnly("io.micronaut.validation:micronaut-validation-processor")
    implementation("io.micronaut.test:micronaut-test-core")
    implementation("io.micronaut:micronaut-http-client")
    implementation("io.micronaut.data:micronaut-data-jdbc")
    implementation("io.micronaut.reactor:micronaut-reactor")
    implementation("io.micronaut.reactor:micronaut-reactor-http-client")
    implementation("jakarta.annotation:jakarta.annotation-api")
    compileOnly("io.micronaut:micronaut-http-validation")
    implementation("io.micronaut:micronaut-management")
    compileOnly("io.micronaut:micronaut-inject-groovy")
    implementation("org.snakeyaml:snakeyaml-engine:3.0")

    implementation("io.micronaut.flyway:micronaut-flyway")
    runtimeOnly("org.postgresql:postgresql")
    runtimeOnly("org.flywaydb:flyway-database-postgresql")
    implementation("io.micronaut.cache:micronaut-cache-core")
    implementation("io.micronaut.cache:micronaut-cache-caffeine")

    implementation("io.micronaut.sql:micronaut-jdbc-hikari")

    // Security
    implementation("io.micronaut.security:micronaut-security-session")
    compileOnly("io.micronaut.security:micronaut-security-annotations")
    // OpenID Connect
    implementation("io.micronaut.security:micronaut-security-oauth2")
    implementation("io.micronaut.security:micronaut-security-jwt")

    implementation('org.jboss.resteasy:resteasy-client:7.0.3.Final')
    testImplementation('org.htmlunit:htmlunit:4.21.0')
    //Email
    implementation("io.micronaut.email:micronaut-email-javamail")
    runtimeOnly("org.eclipse.angus:angus-mail")

    testImplementation ("io.micronaut:micronaut-inject-groovy")

    testRuntimeOnly("org.testcontainers:testcontainers:2.0.3")
    testRuntimeOnly("org.testcontainers:postgresql:1.21.4")
    testRuntimeOnly("org.postgresql:postgresql")

    implementation('org.apache.commons:commons-rng-simple:1.7')
    implementation('org.apache.commons:commons-text:1.15.0')

    testImplementation("org.spockframework:spock-core") {
        exclude group: "org.codehaus.groovy", module: "groovy-all"
    }

    testImplementation 'org.reflections:reflections:0.10.2'

    // UUIDs
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'
}

apply from: 'build-docker.gradle'
apply from: 'build-open-api.gradle'
apply from: 'build-typescript-client.gradle'

application {
    mainClass.set("org.maurodata.controller.Application")
}

micronaut {
    runtime("netty")
    testRuntime("spock2")
    aot {
        // Please review carefully the optimizations enabled below
        // Check https://micronaut-projects.github.io/micronaut-aot/latest/guide/ for more details
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
    }
}

tasks.named('compileGroovy') {
    options.fork = true
//    options.forkOptions.jvmArgs += [
//        "-Dmicronaut.environments=openapi"
//    ]
    doFirst {
        println "compileGroovy jvmArgs = ${options.forkOptions.jvmArgs}"
    }
}

plugins.withId('maven-publish') {
    publishing {
        publications.withType(MavenPublication).configureEach {
            artifact(tasks.named('packageTypeScriptClient'))
        }
    }
}
