String dockerPassword = System.getenv('DOCKERHUB_PASSWORD')?:System.getenv('DOCKER_PASSWORD')

String uiVersion = System.getenv('UI_VERSION')?:project.findProperty('uiVersion')?:null
String uiRelease = System.getenv('UI_RELEASE')?:project.findProperty('uiRelease')?:null

String mauroRepository = 'https://mauro-repository.com'
