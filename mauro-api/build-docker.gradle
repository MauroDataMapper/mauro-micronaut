String latestLts(String product, String fallback, String detectLTS) {
    if(!detectLTS){return fallback}
    try {
        String endoflife = 'https://endoflife.date/api/v1/products/'
        Object json = new JsonSlurper().parse(new URI("${endoflife}${product}").toURL())

        Object releases = json.result.releases
        List ltsReleases = releases.findAll {r ->
            (r.isLts == true) || (r.label =~ /LTS/)
        }

        Object latest = ltsReleases.sort {a, b ->
            b.releaseDate <=> a.releaseDate
        }[0]

        if (latest.codename == null) {
            return latest.name
        }

        return latest.codename.substring(0, latest.codename.indexOf(' ')).toLowerCase()
    }
    catch(Exception e){
        logger.warn("⚠️ Failed to fetch LTS info for ${product}, falling back to ${fallback} (reason: ${e.message})")
        return fallback
    }
}

String temurinDefault = '21'
String ubuntuDefault = 'noble'
String detectLTS = false

String dockerBaseImage = "eclipse-temurin:${latestLts('eclipse-temurin',temurinDefault,detectLTS)}-jre-${latestLts('ubuntu',ubuntuDefault,detectLTS)}"

boolean dockerIncludeDatabase = !gradle.startParameter.taskNames.any { it.contains('dockerBuild') && (it.contains("NoDatabase") || it.contains("Backend")) }
boolean dockerIncludeUI = !gradle.startParameter.taskNames.any { it.contains('dockerBuild') && it.contains("Backend") }
boolean dockerBackendOnly = !dockerIncludeDatabase && !dockerIncludeUI
boolean dockerMultiArch = gradle.startParameter.taskNames.any { it.contains('dockerBuild') && (it.contains("MultiArch") || it.contains("Backend"))}

String dockerHost = System.getenv('DOCKER_HOST')?:project.findProperty('dockerHost')?:null
String dockerPort = dockerHost?(System.getenv('DOCKER_PORT')?:project.findProperty('dockerPort')?:null):null
String dockerHostPort = [dockerHost,dockerPort].findAll { it != null && !it.isEmpty() }.join(':')

String DOCKER_NAMESPACE = System.getenv('DOCKER_NAMESPACE')
String dockerNamespaceProp = project.findProperty('dockerNamespace')
String dockerNamespace = DOCKER_NAMESPACE!=null?DOCKER_NAMESPACE:dockerNamespaceProp!=null?dockerNamespaceProp:'maurodatamapper'

String dockerRepository = System.getenv('DOCKER_REPOSITORY')?:project.findProperty('dockerRepository')?:'mauro'


String DOCKER_TAG = System.getenv('DOCKER_TAG')
String dockerTagProp = project.findProperty('dockerTag')
String dockerTag = DOCKER_TAG != null ? DOCKER_TAG : dockerTagProp !=null ? dockerTagProp : "${version}"

String DOCKER_PREFIX = System.getenv('DOCKER_PREFIX')
String dockerTagPrefixProp = project.findProperty('dockerTagPrefix')
String dockerTagPrefix = dockerTag?(DOCKER_PREFIX!=null?DOCKER_PREFIX:dockerTagPrefixProp!=null?dockerTagPrefixProp:[(dockerMultiArch?null:"${System.getProperty('os.arch')}"),(dockerBackendOnly?'backend':null),(!dockerBackendOnly && !dockerIncludeDatabase?'nodb':null)].findAll {it != null && !it.isEmpty() }.join('-')):null

String dockerHostPortAndNamespace = [(dockerHostPort?dockerHostPort:null),(dockerNamespace?dockerNamespace:null)].findAll { it != null && !it.isEmpty() }.join('/')
String dockerHostPortAndNamespaceAndRepository = [dockerHostPortAndNamespace,dockerRepository].findAll { it != null && !it.isEmpty() }.join('/')
String dockerTagWithPrefix = "${dockerTagPrefix != null && !dockerTagPrefix.isEmpty()?dockerTagPrefix+'-':''}${dockerTag}"

String dockerPushImage = [dockerHostPortAndNamespaceAndRepository,dockerTagWithPrefix].findAll { it != null && !it.isEmpty() }.join(':')

/*
https://docs.docker.com/reference/cli/docker/image/tag/#extended-description
dockerPushImage = [DOCKER_HOST[:DOCKER_PORT]/][DOCKER_NAMESPACE/]DOCKER_REPOSITORY[:[DOCKER_PREFIX-]DOCKER_TAG]
*/

