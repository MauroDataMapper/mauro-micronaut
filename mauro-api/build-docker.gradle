    }
}

tasks.register('fetchMDMUI') {
    doLast {
        if(!dockerIncludeUI) {

            if(uiTargetDir.exists()) {
                println "Removing UI files"
                project.delete(uiTargetDir)
            }

            return
        }

        println "Fetching UI list from $uiRepoApi"
        String jsonText = new URI(uiRepoApi).toURL().getText(requestProperties: ['Accept': 'application/json'])
        Object parsed = new JsonSlurper().parseText(jsonText)

        String fileName
        if (uiVersion) {
            fileName = "mdm-ui-${uiVersion}.tgz"
            if (!parsed.files*.name.find {it == fileName}) {
                throw new GradleException("UI version ${uiVersion} not found in repository")
            }
        } else {
            fileName = parsed.files.last().name
        }

        String downloadUrl = "${mauroRepository}/${repositoryPath}/${fileName}"
        println "Downloading UI: $fileName from ${downloadUrl}"
        uiTargetDir.mkdirs()

        File tmpFile = File.createTempFile('mdmui', '.tgz')
        tmpFile.withOutputStream { out ->
            out << new URI(downloadUrl).toURL().openStream()
        }

        println "Extracting UI ${tmpFile.absolutePath} into ${uiTargetDir.absolutePath}"

        Process processTar = ['tar', '-xzf', tmpFile.absolutePath, '-C', uiTargetDir.absolutePath, '--strip-components=1'].execute()
        processTar.waitFor()

        tmpFile.delete()

        println "Patching Angular API endpoint to relative /api"
        Set<File> jsFiles = fileTree(dir: uiTargetDir, include: 'main.*.js').files

        if (jsFiles) {

            List<String> sedInlineArgs = System.getProperty("os.name").toLowerCase().contains("mac") ?
                                ['-i', ''] : ['-i']

            List<String> jsFilePaths = jsFiles.collect { it.absolutePath }

            List<String> cmd = ['sed'] +
                      sedInlineArgs +
                      ['s|this.apiEndpoint="http://localhost:8080/api"|this.apiEndpoint="/api"|g'] +
                      jsFilePaths

            Process processSed = new ProcessBuilder(cmd)
                .directory(uiTargetDir)
                .start()
            processSed.waitFor()

        } else {
            logger.warn("No main.*.js files found in ${uiTargetDir}")
        }
    }
}

tasks.named('dockerBuild') {
    dependsOn(tasks.named('fetchMDMUI'))
    dependsOn(tasks.named('stageDockerFiles'))

    images = [dockerPushImage]

    println "🐳 Docker tag [ ${dockerPushImage} ]"
}

tasks.register('stageDockerFiles', Copy) {
    File dockerMainScripts=project.layout.buildDirectory.dir("docker/main/scripts").get().asFile
    if(dockerMainScripts.exists()){
        delete(dockerMainScripts)
    }
    mkdir(dockerMainScripts)
    if(!dockerIncludeDatabase) {
        from file('docker/noDB')
        into dockerMainScripts
    } else {
        from file('docker/all')
        into dockerMainScripts
    }
}

tasks.named("dockerfile") {
    baseImage("${dockerBaseImage}")

    String instructions

    if(!dockerIncludeDatabase) {
        instructions = file('docker/noDB/instructions').text
    } else {
        instructions = file('docker/all/instructions').text
    }

    instruction "${instructions}"

    outputs.file("build/docker/main/Dockerfile")

    doLast {
        File dockerfile = file("build/docker/main/Dockerfile")
        String contents = dockerfile.text
        int entrypointPos = contents.lastIndexOf('ENTRYPOINT')
        dockerfile.text = dockerfile.text.substring(0,entrypointPos)
    }
}

tasks.register('dockerBuildMultiArch') {
    dependsOn(tasks.named('buildLayers'))
    dependsOn(tasks.named('dockerfile'))
    dependsOn(tasks.named('fetchMDMUI'))
    dependsOn(tasks.named('stageDockerFiles'))

    File locationFile = project.layout.buildDirectory.dir("docker/main").get().asFile

    doLast {
        println "🐳 Running docker build with multi-arch buildx command..."
        println "🐳 Docker tag [ ${dockerPushImage} ]"

        String location = locationFile.absolutePath

        boolean useLogin = dockerUsername && dockerPassword

        if(useLogin) {
            ProcessBuilder processBuilderDockerLogin = new ProcessBuilder(['docker', 'login', '--username', dockerUsername, '--password-stdin', dockerHostPort].findAll{ it})
            Process processDockerLogin = processBuilderDockerLogin.start()

            processDockerLogin.outputStream.withWriter('UTF-8') {writer ->
                writer.write("${dockerPassword}\n")
            }

            Thread.start {
                processDockerLogin.inputStream.eachLine { println it }
            }
            Thread.start {
                processDockerLogin.errorStream.eachLine { System.err.println it }
            }
            int rc = processDockerLogin.waitFor()
            if (rc != 0) {
                throw new GradleException("docker login failed (${rc})")
            }
        }

        if(useLogin) {
            println "🐳 Logged in, build and push image ]"
        } else {
            println "🐳 Not logged in, build image without pushing ]"
        }
        ProcessBuilder processBuilderDockerx = new ProcessBuilder(['docker', 'buildx', 'build', '--no-cache', '--platform', 'linux/amd64,linux/arm64', '--progress=plain',(useLogin?'--push':null), '--tag', dockerPushImage, location].findAll {it})

        Process processDockerx = processBuilderDockerx.start()
        Thread.start {
            processDockerx.inputStream.eachLine { println it }
        }
        Thread.start {
            processDockerx.errorStream.eachLine { System.err.println it }
        }
        int rc = processDockerx.waitFor()
        if (rc != 0) {
            throw new GradleException("buildx failed (${rc})")
        }
    }
}

tasks.register('dockerBuildNoDatabase') {
    dependsOn(tasks.named('dockerBuild'))
}

tasks.register('dockerBuildMultiArchNoDatabase') {
    dependsOn(tasks.named('dockerBuildMultiArch'))
}

tasks.register('dockerBuildBackend') {
    dependsOn(tasks.named('dockerBuildMultiArch'))
}


