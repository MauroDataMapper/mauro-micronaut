micronaut:
    caches:
        items-cache:
            initial-capacity: 10000
            maximum-weight: 1_000_000_000
            expire-after-write: 1h
            record-stats: true

mauro:
    search:
        rebuild:
            scheduled:
                enabled: false

datasources:
    default:
        url: "jdbc:tc:postgresql:${POSTGRES_VERSION:16}-alpine:///db"
        username: sandbox
        password: sandbox
        dialect: POSTGRES
        db-type: postgres
        driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
logger:
    levels:
#       io.micronaut.data: DEBUG
#        com.zaxxer.hikari: DEBUG
#        org.postgresql: DEBUG
