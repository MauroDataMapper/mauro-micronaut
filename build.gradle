import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar

plugins {
    id 'java-library'
    id 'groovy'
    id "com.vanniktech.maven.publish" version "0.34.0"
    id "org.graalvm.buildtools.native" version "0.11.5" apply false
}

repositories {
    mavenCentral()
}

subprojects {
    repositories {
        mavenLocal()
        mavenCentral()
    }

    plugins.withType(JavaPlugin).configureEach {
        java {
            sourceCompatibility = JavaVersion.toVersion("17")
            targetCompatibility = JavaVersion.toVersion("17")
        }

        dependencies {
            implementation("io.micronaut:micronaut-jackson-databind")
            implementation("io.micronaut.validation:micronaut-validation")
            implementation("jakarta.validation:jakarta.validation-api")
            implementation("io.micronaut.groovy:micronaut-runtime-groovy")
            implementation("org.apache.groovy:groovy-json:4.0.33")
            implementation("org.apache.groovy:groovy-xml:4.0.33")
            implementation("ch.qos.logback:logback-classic")
            implementation("ch.qos.logback:logback-core")
            runtimeOnly("org.yaml:snakeyaml")
            implementation('com.fasterxml.uuid:java-uuid-generator:5.1.0')

            testImplementation "io.micronaut.test:micronaut-test-spock"
            testRuntimeOnly "org.junit.platform:junit-platform-launcher"
            testRuntimeOnly("ch.qos.logback:logback-classic")
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            maxParallelForks = 1
        }
    }

    afterEvaluate {
        if (plugins.hasPlugin('java-test-fixtures')) {
            dependencies {
                testFixturesImplementation("jakarta.validation:jakarta.validation-api")
            }
        }

        if (plugins.hasPlugin('codenarc')) {
            dependencies {
                codenarc 'org.apache.groovy:groovy-all:4.0.33'
                codenarc 'org.codenarc:CodeNarc:3.6.0-groovy-4.0'
            }

            codenarc {
                toolVersion = "3.7.0"
                configFile = rootProject.file("config/codenarc/codenarc.groovy")
            }

            tasks.matching { it.name.startsWith('codenarc') }.configureEach {
                ignoreFailures = true
            }

            if (tasks.names.contains('codenarcMain')) {
                tasks.named('codenarcMain').configure {
                    compilationClasspath = sourceSets.main.compileClasspath + sourceSets.main.output
                }
            }

            if (tasks.names.contains('codenarcTest')) {
                tasks.named('codenarcTest').configure {
                    compilationClasspath = tasks.named('codenarcMain').map { it.compilationClasspath }.get() + sourceSets.test.compileClasspath + sourceSets.test.output
                }
            }
        }
    }

    // Applies when maven-publish is present (Micronaut & Vanniktech both apply it)
    plugins.withId("maven-publish") {
        publishing {
            publications.withType(MavenPublication).configureEach {
                // prefer GROUP / VERSION_NAME if present; else fallback to Gradle's group/version
                groupId    = (findProperty("GROUP") ?: project.group).toString()
                artifactId = (findProperty("POM_ARTIFACT_ID") ?: project.name).toString()
                version    = (findProperty("VERSION_NAME") ?: project.version).toString()
            }

            // your extra repos belong *here*
            repositories {
                maven {
                    name = "MauroSnapshotRepository"
                    url = uri("https://mauro-repository.com/libs-snapshot-local")
                    credentials(PasswordCredentials)
                    authentication { basic(BasicAuthentication) }
                }
            }
        }
    }

    plugins.withId("com.vanniktech.maven.publish") {

        java {
            sourceCompatibility = JavaVersion.toVersion("17")
            targetCompatibility = JavaVersion.toVersion("17")
        }


        mavenPublishing {
            // Use GROUP/VERSION_NAME if present, else fall back to project.group/version
            def g = (findProperty("GROUP") ?: project.group).toString()
            def v = (findProperty("VERSION_NAME") ?: project.version).toString()
            coordinates(g, project.name, v)

            configure(new JavaLibrary(new JavadocJar.Empty(), /* sourcesJar */ true))

            publishToMavenCentral()
            signAllPublications()

            pom {
                url = "https://github.com/MauroDataMapper/mauro-micronaut"
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'jamesrwelch'
                        name = 'James Welch'
                        email = 'james.welch@bdi.ox.ac.uk'
                    }
                    developer {
                        id = 'joe-crawford'
                        name = 'Joseph Crawford'
                    }
                    developer {
                        id = 'edwardcrichton'
                        name = 'Edward Crichton'
                    }
                }
                scm {
                    url = "https://github.com/MauroDataMapper/mauro-micronaut"
                }

            }
        }
    }
}

project(':mauro-domain') {
    plugins.withId("com.vanniktech.maven.publish") {
        mavenPublishing {
            pom {
                name = 'Mauro Domain'
                description = 'The \'domain layer\' of Mauro which defines the underlying data model and additional Mauro concepts such as plugins, profiles, etc.'
            }
        }
    }
}

project(':mauro-persistence') {
    plugins.withId("com.vanniktech.maven.publish") {
        mavenPublishing {
            pom {
                name = 'Mauro Persistence'
                description = 'The code for persisting Mauro objects into a Postgres database, including an in-memory caching layer'
            }
        }
    }
}

project(':mauro-client') {
    plugins.withId("com.vanniktech.maven.publish") {
        mavenPublishing {
            pom {
                name = 'Mauro Client'
                description = 'Interfaces that Micronaut uses to generate client / SDK code for interacting with a Mauro API'
            }
        }
    }
}

project(':mauro-api') {
    plugins.withId("com.vanniktech.maven.publish") {
        mavenPublishing {
            pom {
                name = 'Mauro API'
                description = 'Controllers and business logic for defining the Mauro API: this is the \'application layer\' of Mauro'
            }
        }
    }
}

tasks.withType(GroovyCompile).configureEach {
    groovyOptions.forkOptions.memoryInitialSize = '256m'
    groovyOptions.forkOptions.memoryMaximumSize = '4g'
}

test {
    maxParallelForks = 1
}
