# This workflow builds and tests the Java project with shared Mauro CI workflows.

name: Java CI with Gradle

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    uses: MauroDataMapper/mauro-ci/.github/workflows/gradle-test.yml@01c5abd2d6c0df162d9dd05f5ceca37814f7912b
    with:
      java-version: "17"
      gradle-task: test

  lint:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main'))
    uses: MauroDataMapper/mauro-ci/.github/workflows/megalinter.yml@01c5abd2d6c0df162d9dd05f5ceca37814f7912b
    with:
      language: groovy
      scan-mode: ${{ github.event_name == 'pull_request' && 'changed' || 'full' }}
      scan-pr-commits: true

  junit-report:
    if: always()
    needs: test
    permissions:
      actions: read
      checks: write
      contents: read
    uses: MauroDataMapper/mauro-ci/.github/workflows/junit-report.yml@01c5abd2d6c0df162d9dd05f5ceca37814f7912b

  sarif-upload:
    if: always()
    needs: lint
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: MauroDataMapper/mauro-ci/.github/workflows/sarif-upload.yml@01c5abd2d6c0df162d9dd05f5ceca37814f7912b

  docker-develop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [test, lint, junit-report, sarif-upload]
    uses: MauroDataMapper/mauro-ci/.github/workflows/docker-build.yml@01c5abd2d6c0df162d9dd05f5ceca37814f7912b
    with:
      java-version: "17"

  snapshot-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [test, lint, junit-report, sarif-upload, docker-develop]
    uses: MauroDataMapper/mauro-ci/.github/workflows/gradle-publish.yml@01c5abd2d6c0df162d9dd05f5ceca37814f7912b
    with:
      target: snapshot
      java-version: "17"
    secrets:
      SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
      REPOSITORY_USERNAME: ${{ secrets.MAURO_SNAPSHOT_REPOSITORY_USERNAME }}
      REPOSITORY_PASSWORD: ${{ secrets.MAURO_SNAPSHOT_REPOSITORY_PASSWORD }}

  maven-central-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, junit-report, sarif-upload]
    uses: MauroDataMapper/mauro-ci/.github/workflows/gradle-publish.yml@01c5abd2d6c0df162d9dd05f5ceca37814f7912b
    with:
      target: maven-central
      java-version: "17"
    secrets:
      SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
      REPOSITORY_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      REPOSITORY_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

  dockerhub-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: maven-central-publish
    uses: MauroDataMapper/mauro-ci/.github/workflows/docker-publish.yml@01c5abd2d6c0df162d9dd05f5ceca37814f7912b
    with:
      java-version: "17"
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

  notify:
    if: always()
    needs:
      - test
      - lint
      - junit-report
      - sarif-upload
      - docker-develop
      - snapshot-publish
      - maven-central-publish
      - dockerhub-publish
    permissions: {}
    uses: MauroDataMapper/mauro-ci/.github/workflows/zulip-notify.yml@01c5abd2d6c0df162d9dd05f5ceca37814f7912b
    with:
      workflow-name: ${{ github.workflow }}
      build-result: >-
        ${{ (needs.test.result == 'failure' || needs.junit-report.result == 'failure') && 'failure' ||
            (needs.test.result == 'cancelled' || needs.junit-report.result == 'cancelled') && 'cancelled' ||
            (needs.test.result == 'success' || needs.junit-report.result == 'success') && 'success' ||
            'skipped' }}
      lint-result: >-
        ${{ (needs.lint.result == 'failure' || needs.sarif-upload.result == 'failure') && 'failure' ||
            (needs.lint.result == 'cancelled' || needs.sarif-upload.result == 'cancelled') && 'cancelled' ||
            (needs.lint.result == 'success' || needs.sarif-upload.result == 'success') && 'success' ||
            'skipped' }}
      docker-result: >-
        ${{ needs.docker-develop.result != 'skipped' && needs.docker-develop.result ||
            needs.dockerhub-publish.result }}
      snapshot-result: ${{ needs.snapshot-publish.result }}
      maven-result: ${{ needs.maven-central-publish.result }}
    secrets:
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
