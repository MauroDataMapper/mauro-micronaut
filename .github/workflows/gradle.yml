# This workflow will build and test a Java project with Gradle.

name: Java CI with Gradle

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  actions: read
  checks: write
  security-events: write

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      # Change this single setting to use a different PostgreSQL version for CI tests.
      POSTGRES_VERSION: '16'
    steps:
      - uses: actions/checkout@v6
        with:
          # Changed-file linting and PR secret scans need the base commit available locally.
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Log Gradle version
        run: ./gradlew --version

      - name: Test with Gradle
        env:
          GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=512m'
        run: ./gradlew --no-daemon --max-workers=1 test

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Test Results
          path: '**/build/test-results/**/*.xml'
          reporter: java-junit

      - name: Upload Gradle test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Gradle test diagnostics
          path: '**/build/reports/tests/**'
          if-no-files-found: warn
          retention-days: 7

      - name: MegaLinter (changed files and PR secrets)
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: oxsecurity/megalinter/flavors/java@v9
        env:
          VALIDATE_ALL_CODEBASE: "false"
          DEFAULT_BRANCH: ${{ github.base_ref }}
          ENABLE_LINTERS: ACTION_ACTIONLINT,API_SPECTRAL,BASH_EXEC,BASH_SHFMT,GROOVY_NPM_GROOVY_LINT,JSON_JSONLINT,JSON_V8R,JSON_PRETTIER,MARKDOWN_MARKDOWNLINT,MARKDOWN_MARKDOWN_TABLE_FORMATTER,REPOSITORY_GITLEAKS,XML_XMLLINT,YAML_PRETTIER,YAML_YAMLLINT,YAML_V8R
          PULL_REQUEST: "true"
          REPOSITORY_GITLEAKS_PR_COMMITS_SCAN: "true"
          REPOSITORY_GITLEAKS_PR_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY_GITLEAKS_PR_TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          GROOVY_NPM_GROOVY_LINT_FILE_EXTENSIONS: .groovy,.gradle
          DISABLE_ERRORS: true
          SARIF_REPORTER: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: MegaLinter (full repository)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && (success() || failure())
        uses: oxsecurity/megalinter/flavors/java@v9
        env:
          VALIDATE_ALL_CODEBASE: true
          ENABLE_LINTERS: ACTION_ACTIONLINT,API_SPECTRAL,BASH_EXEC,BASH_SHFMT,GROOVY_NPM_GROOVY_LINT,JSON_JSONLINT,JSON_V8R,JSON_PRETTIER,MARKDOWN_MARKDOWNLINT,MARKDOWN_MARKDOWN_TABLE_FORMATTER,REPOSITORY_GIT_DIFF,REPOSITORY_GITLEAKS,REPOSITORY_GRYPE,REPOSITORY_SECRETLINT,REPOSITORY_SYFT,REPOSITORY_TRIVY,REPOSITORY_TRIVY_SBOM,REPOSITORY_TRUFFLEHOG,XML_XMLLINT,YAML_PRETTIER,YAML_YAMLLINT,YAML_V8R
          GROOVY_NPM_GROOVY_LINT_FILE_EXTENSIONS: .groovy,.gradle
          DISABLE_ERRORS: true
          SARIF_REPORTER: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive lint reports
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && (success() || failure())
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log

      - name: Upload MegaLinter scan results to GitHub Security tab
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && (success() || failure())
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif
          ref: refs/heads/${{ github.head_ref || github.ref_name }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          category: MegaLinter-Groovy
          wait-for-processing: true

  docker-develop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test Docker Build
        env:
          GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=512m'
        run: ./gradlew --no-daemon --max-workers=1 dockerBuildMultiArch

  snapshot-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [build, docker-develop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Generate OpenAPI resources and publish snapshot
        env:
          GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=512m'
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: >-
          ./gradlew --stacktrace --no-daemon --max-workers=1
          -PenableOpenApi=true -PopenApiGeneratorMaxHeap=4g
          -PMauroSnapshotRepositoryUsername=${{ secrets.MAURO_SNAPSHOT_REPOSITORY_USERNAME }}
          -PMauroSnapshotRepositoryPassword=${{ secrets.MAURO_SNAPSHOT_REPOSITORY_PASSWORD }}
          publishAllPublicationsToMauroSnapshotRepositoryRepository

  maven-central-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Publish to Maven Central
        env:
          GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=512m'
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
        run: >-
          ./gradlew --stacktrace --no-daemon --max-workers=1
          -PenableOpenApi=true -PopenApiGeneratorMaxHeap=4g
          publishAllPublicationsToMavenCentralRepository

  dockerhub-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: maven-central-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish multi-architecture image
        env:
          GRADLE_OPTS: '-Xmx4g -XX:MaxMetaspaceSize=512m'
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: >-
          ./gradlew --stacktrace --no-daemon --max-workers=1
          -PenableOpenApi=true -PopenApiGeneratorMaxHeap=4g dockerBuildMultiArch

  notify:
    if: always()
    needs: [build, docker-develop, snapshot-publish, maven-central-publish, dockerhub-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Send a stream message
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: "githubactionsbot-bot@maurodatamapper.zulipchat.com"
          organization-url: "https://maurodatamapper.zulipchat.com"
          to: "build/github-actions"
          type: "stream"
          topic: "${{github.repository}}"
          content: >-
            ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && ':cross_mark:' || ':check_mark:' }}
            ${{github.repository}} : **${{github.ref}}**
            GitHub Actions results: build=${{needs.build.result}}, develop-docker=${{needs.docker-develop.result}}, snapshot=${{needs.snapshot-publish.result}}, maven-central=${{needs.maven-central-publish.result}}, dockerhub=${{needs.dockerhub-publish.result}}
            ${{ github.event.pull_request.html_url || github.event.head_commit.url }}
